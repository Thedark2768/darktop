<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enviar reseña | DarkTop</title>

</head>

<body>

<h1>Enviar reseña</h1>

<input
    id="codigo"
    type="text"
    placeholder="Código de reseña">

<button id="validar">

    Validar código

</button>

<p id="mensaje"></p>

<div id="formulario" hidden>

    <h2>Reseña</h2>

    <p id="producto"></p>

    <p id="jugador"></p>

    <label for="estrellas">Calificación</label>

<select id="estrellas">
    <option value="5">⭐⭐⭐⭐⭐ (5)</option>
    <option value="4">⭐⭐⭐⭐ (4)</option>
    <option value="3">⭐⭐⭐ (3)</option>
    <option value="2">⭐⭐ (2)</option>
    <option value="1">⭐ (1)</option>
</select>

<label for="comentario">Comentario</label>

<textarea
    id="comentario"
    rows="5"
    maxlength="500"
    placeholder="Cuéntanos cómo fue tu experiencia."></textarea>

<button id="enviarResena">
    Enviar reseña
</button>
</div>

<script type="module" src="scripts/review.js"></script>

</body>

</html>
