<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enviar reseña | DarkTop</title>

    <link rel="stylesheet" href="css/review.css">
</head>
<body>

    <main class="review-container">

        <h1>⭐ Comparte tu experiencia</h1>

        <p>
            Introduce el código de reseña que recibiste al realizar tu pedido.
        </p>

        <input
            type="text"
            id="reviewCode"
            placeholder="CR-XXXX-XXXX"
            autocomplete="off">

        <button id="validateButton">
            Validar código
        </button>

        <p id="message"></p>

        <!-- Aquí aparecerá el formulario más adelante -->
        <section id="reviewForm" style="display:none;">
        </section>

    </main>

    <script type="module" src="scripts/review.js"></script>

</body>
</html>
