<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enviar reseña | DarkTop</title>

</head>

<body>
    <header class="header">

    <a href="index.html" class="logo">
            <img src="assets/darktop/favicon.png" alt="DarkTop">
        </a>

    <nav class="navbar"
     id="mobileMenu"
     aria-label="Menú principal">

    <a href="index.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="contacto.html">Contacto</a>

    </nav>

    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">

        <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg">

            <path
                d="M4 6H20
                   M4 12H20
                   M4 18H20"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"/>

        </svg>

    </button>

    

    </header>

<h1>Enviar reseña</h1>

<input
    id="codigo"
    type="text"
    placeholder="Código de reseña">

<button id="validar">

    Validar código

</button>

<p id="mensaje"></p>

<div id="formulario" hidden>

    <h2>Reseña</h2>

    <p id="producto"></p>

    <p id="jugador"></p>

    <label for="estrellas">Calificación</label>

<select id="estrellas">
    <option value="5">⭐⭐⭐⭐⭐ (5)</option>
    <option value="4">⭐⭐⭐⭐ (4)</option>
    <option value="3">⭐⭐⭐ (3)</option>
    <option value="2">⭐⭐ (2)</option>
    <option value="1">⭐ (1)</option>
</select>

<label for="comentario">Comentario</label>

<textarea
    id="comentario"
    rows="5"
    maxlength="500"
    placeholder="Cuéntanos cómo fue tu experiencia."></textarea>

<button id="enviarResena">
    Enviar reseña
</button>
</div>

<script type="module" src="scripts/review.js"></script>
    <script src="scripts/header.js"></script>


</body>

</html>
