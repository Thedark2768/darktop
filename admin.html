<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkTop | Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>


<header class="admin-header">
    <h1>DarkTop Admin</h1>
    <p>Panel de gestión de pedidos</p>
    <button id="logoutBtn">
    Cerrar sesión
    </button>
</header>


<main class="admin-container">

    <div class="tabs">

        <button
            id="tabPedidos"
            class="tab active">

            📦 Pedidos

        </button>

        <button
            id="tabReviews"
            class="tab">

            ⭐ Reseñas

        </button>

    </div>

    <section
        id="pedidosPanel">

        <h2>Pedidos</h2>

        <section
            id="listaPedidos"
            class="pedidos-grid">

            Cargando...

        </section>

    </section>

    <section
        id="reviewsPanel"
        hidden>

        <h2>Reseñas pendientes</h2>

        <section
            id="listaReviews"
            class="pedidos-grid">

            Sin reseñas.

        </section>

    </section>

</main>


</body>
<script type="module" src="scripts/admin.js"></script>

</body>
</html>
